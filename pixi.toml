[workspace]
name = "astrospotfinder"
version = "0.1.0"
description = "Discover suitable astronomy observation spots."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.11,<4"
rasterio = ">=1.3"
shapely = ">=2.0"
numpy = ">=1.24"
scipy = ">=1.11"

[pypi-dependencies]
fastapi = ">=0.115"
pillow = ">=10.0"
httpx = ">=0.27"
uvicorn = { version = ">=0.34", extras = ["standard"] }
pydantic = ">=2.0"
pytest = ">=8.0"

[tasks]
start = { cmd = "python src/main.py", env = { PYTHONPATH = "src" } }
test = "pytest"
